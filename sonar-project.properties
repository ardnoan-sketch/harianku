sonar.projectKey=harianku_app
sonar.projectName=Harianku
sonar.projectVersion=1.0.0

# Source and Test directories
sonar.sources=app,config,database,routes,resources/views
sonar.tests=tests

# Exclusions
sonar.exclusions=vendor/**,storage/**,bootstrap/cache/**,public/**,node_modules/**,database/migrations/**,tests/**

# Path to PHPUnit coverage report (Clover XML)
# Generate this using: php vendor/bin/phpunit --coverage-clover build/logs/clover.xml
sonar.php.coverage.reportPaths=build/logs/clover.xml

# Language/Encoding
sonar.language=php
sonar.sourceEncoding=UTF-8
